<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAValues - Ideologies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Theme Toggle Corner Button -->
    <button class="theme-toggle-corner" id="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24">
            <path class="icon-sun" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 6a6 6 0 100 12 6 6 0 000-12z"></path>
            <path class="icon-moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
    </button>

    <div class="main-container">
        <div class="title-container"><h1 class="brand">MAValues</h1></div>
        <p class="version-text">Ideologies &middot; click one for a short description</p>
        <div class="catalog" id="catalog"></div>
        <div class="button-container">
            <button onclick="location.href='index.html'">Home</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        document.getElementById('catalog').innerHTML = ideologyGroups.map(g => `
            <div class="catalog-card">
                <button class="catalog-title group-title" data-name="${g.name}" style="border-color:${g.color}">${g.name}</button>
                <div class="chip-row">
                    ${ideologies.filter(i => i.group === g.name).map(i => `<button class="chip" data-name="${i.name}" style="border-color:${i.color}">${i.name}</button>`).join('')}
                </div>
            </div>`).join('');
        document.getElementById('catalog').addEventListener('click', e => {
            const c = e.target.closest('[data-name]');
            if (c) openIdeologyInfo(c.dataset.name);
        });
    </script>
</body>
</html>
