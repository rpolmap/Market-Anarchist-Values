<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAValues - Ideologies</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap');

:root {
    --bg-color: #18181b;
    --card-bg: #27272a;
    --text-primary: #f4f4f5;
    --text-dim: #a1a1aa;
    --accent-primary: #d4d4d8;
    --accent-soft: #71717a;
    --border-color: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.05);
    --radius-lg: 28px;
    --radius-sm: 14px;
    --soft-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    --hover-shadow: rgba(255, 255, 255, 0.1);
    --corner-fill: #f4f4f5;
    --corner-color: #18181b;
    --smooth-transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
}

[data-theme="light"] {
    --bg-color: #f4f4f6;
    --card-bg: #ffffff;
    --text-primary: #18181b;
    --text-dim: #71717a;
    --accent-primary: #27272a;
    --accent-soft: #e4e4e7;
    --border-color: rgba(0, 0, 0, 0.09);
    --card-border: rgba(0, 0, 0, 0.06);
    --soft-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    --hover-shadow: rgba(0, 0, 0, 0.12);
    --corner-fill: #18181b;
    --corner-color: #f4f4f6;
}

.theme-toggle-corner {
    position: fixed;
    top: 0;
    right: 0;
    width: 80px;
    height: 80px;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 9999;
    padding: 0;
    line-height: 0;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    outline: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.theme-toggle-corner:focus,
.theme-toggle-corner:focus-visible,
.theme-toggle-corner:active {
    outline: none;
    box-shadow: none;
}

.theme-toggle-corner svg {
    width: 100%;
    height: 100%;
    fill: var(--corner-fill);
    color: var(--corner-color);
    transition: var(--smooth-transition);
}

.theme-toggle-corner:hover svg {
    transform: scale(1.06);
}

.theme-toggle-corner .icon-sun,
.theme-toggle-corner .icon-moon {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.theme-toggle-corner .icon-sun {
    display: block;
}
.theme-toggle-corner .icon-moon {
    display: none;
}

[data-theme="light"] .theme-toggle-corner .icon-sun {
    display: none;
}
[data-theme="light"] .theme-toggle-corner .icon-moon {
    display: block;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-container {
    width: 100%;
    max-width: 1200px;
    min-height: 100vh;
    padding: 60px 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.title-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

h1 {
    font-weight: 700;
    font-size: 3.2rem;
    margin: 0;
    color: var(--accent-primary);
    letter-spacing: -1.5px;
    text-align: center;
}

.question-container {
    min-height: 140px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
}

#question {
    background-color: var(--card-bg);
    padding: 35px 50px;
    border-radius: var(--radius-lg);
    font-size: 1.4rem;
    font-weight: 500;
    line-height: 1.5;
    box-shadow: var(--soft-shadow);
    max-width: 800px;
    border: 1px solid var(--card-border);
    text-align: center;
}

button {
    padding: 16px 24px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--smooth-transition);
}

button:hover {
    background-color: var(--text-primary);
    color: var(--bg-color);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px var(--hover-shadow);
}

.description-box {
    background-color: var(--card-bg);
    padding: 24px 30px;
    border-radius: var(--radius-lg);
    text-align: center;
    line-height: 1.7;
    border: 1px solid var(--card-border);
    width: 100%;
    max-width: 800px;
    box-sizing: border-box;
    align-self: center;
    margin-bottom: 30px;
    box-shadow: var(--soft-shadow);
    font-size: 1.1rem;
}

#buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 480px;
    margin-top: 10px;
    margin-bottom: 50px;
}

.button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
    margin-bottom: 40px;
    width: 100%;
}

.button-container button {
    width: auto;
    min-width: 220px;
    max-width: 400px;
    text-align: center;
}

.main-results-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px 0;
}

#results-container {
    display: grid;
    grid-template-columns: repeat(3, 140px);
    justify-content: center;
    gap: 24px 30px;
    margin-top: 20px;
    margin-bottom: 35px;
    width: 100%;
    box-sizing: border-box;
}

.result-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 140px;
    box-sizing: border-box;
    transition: var(--smooth-transition);
}

.result-icon {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    margin-bottom: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    transition: var(--smooth-transition);
}

.result-item:hover .result-icon {
    transform: scale(1.08);
}

.result-text {
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text-dim);
    text-transform: uppercase;
    text-align: center;
    width: 100%;
    margin: 0;
}

.label-bubble {
    display: inline-block;
    padding: 14px 40px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1.8rem;
    color: #ffffff;
    margin: 15px 0;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
}

.result-header-text {
    font-size: 1.1rem;
    color: var(--text-dim);
    font-weight: 700;
    margin-top: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

@media (max-width: 800px) {
    #results-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px 10px;
        max-width: 420px;
    }
    .result-item {
        width: 100% !important;
        max-width: 105px;
    }
    .result-icon {
        width: 70px;
        height: 70px;
    }
    .result-text {
        font-size: 0.68rem;
    }
    h1 {
        font-size: 2.3rem;
    }
}

/* ---------- MAValues additions ---------- */
.brand {
    letter-spacing: -2px;
}

.results-heading {
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 6px;
    color: var(--text-primary);
    text-align: center;
}

.result-item,
.label-bubble,
.bar-row,
.chip {
    cursor: pointer;
}

.result-text {
    text-transform: none;
    font-size: 0.9rem;
    color: var(--text-primary);
}

.bars {
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
}

.bar-row {
    margin: 8px 0;
    text-align: left;
}

.bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-primary);
}

.bar-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(128, 128, 128, 0.25);
    overflow: hidden;
}

.bar-fill {
    height: 100%;
}

/* Values / Ideologies screens */
.catalog {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin: 25px 0;
}

.catalog-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--soft-shadow);
    padding: 22px 26px;
}

.catalog-title {
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 14px;
}

.group-title {
    background: transparent;
    border-width: 2px;
    border-style: solid;
    color: var(--text-primary);
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 1rem;
}

.chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.chip {
    padding: 10px 18px;
    font-size: 0.95rem;
    border-radius: 50px;
}

/* Popup menu */
.info-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
    box-sizing: border-box;
}

.info-menu {
    position: relative;
    background-color: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--soft-shadow);
    width: 100%;
    max-width: 380px;
    padding: 26px 26px 22px;
    box-sizing: border-box;
    overflow: hidden;
    text-align: left;
}

.info-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
}

.info-close {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1.3rem;
    line-height: 1;
}

.info-title {
    font-size: 1.3rem;
    font-weight: 700;
    padding-right: 34px;
}

.info-sub {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 4px;
}

.info-desc {
    font-size: 1rem;
    line-height: 1.6;
    margin: 14px 0 0;
}

@media (max-width: 800px) {
    .result-text { font-size: 0.75rem; }
}


/* ---------- Added: agree/disagree colours, back button ---------- */
#buttons .btn-agree {
    background-color: rgba(74, 163, 112, 0.16);
    border-color: rgba(74, 163, 112, 0.45);
}
#buttons .btn-agree:hover {
    background-color: rgba(74, 163, 112, 0.45);
    border-color: rgba(74, 163, 112, 0.8);
    color: var(--text-primary);
    box-shadow: 0 5px 15px rgba(74, 163, 112, 0.25);
}
#buttons .btn-disagree {
    background-color: rgba(212, 90, 90, 0.16);
    border-color: rgba(212, 90, 90, 0.45);
}
#buttons .btn-disagree:hover {
    background-color: rgba(212, 90, 90, 0.45);
    border-color: rgba(212, 90, 90, 0.8);
    color: var(--text-primary);
    box-shadow: 0 5px 15px rgba(212, 90, 90, 0.25);
}
.back-wrap {
    margin-top: -20px;
    margin-bottom: 40px;
}
.back-btn {
    padding: 10px 22px;
    font-size: 0.95rem;
    background: transparent;
    color: var(--text-dim);
}

/* ---------- Added: value tiles (values.html) ---------- */
.tile-row {
    display: flex;
    flex-wrap: wrap;
    gap: 22px 16px;
}
.value-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 110px;
    cursor: pointer;
    transition: var(--smooth-transition);
}
.value-tile .result-icon {
    width: 72px;
    height: 72px;
    margin-bottom: 8px;
}
.value-tile:hover .result-icon {
    transform: scale(1.08);
}
.value-tile .result-text {
    font-size: 0.82rem;
}

/* ---------- Added: closest matches box (results.html) ---------- */
.match-box {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 12px auto 30px;
    background-color: color-mix(in srgb, var(--card-bg) 70%, var(--bg-color));
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-sizing: border-box;
}
.match-strip {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    display: flex;
    flex-direction: column;
}
.match-strip span { flex: 1; }
.match-half {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 16px 16px 24px;
}
.match-divider {
    height: 1px;
    background: var(--border-color);
}
.match-img {
    width: 66px;
    height: 44px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}
.match-img.match-person-img {
    width: 44px;
    border-radius: 50%;
    margin: 0 11px;
}
.match-info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
    text-align: left;
}
.match-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
}
.match-name {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.25;
}
.match-pct {
    font-size: 0.85rem;
    color: var(--text-dim);
}
.match-next {
    width: 34px;
    height: 34px;
    padding: 0;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.match-next svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ---------- Added: flag in popup ---------- */
.info-flag {
    width: 150px;
    height: 100px;
    object-fit: cover;
    border-radius: 12px;
}
.info-flag.info-person {
    width: 96px;
    height: 96px;
    border-radius: 50%;
}

</style>
</head>
<body>

    <!-- Theme Toggle Corner Button -->
    <button class="theme-toggle-corner" id="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24">
            <path class="icon-sun" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 6a6 6 0 100 12 6 6 0 000-12z"></path>
            <path class="icon-moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
    </button>

    <div class="main-container">
        <div class="title-container"><h1 class="brand">MAValues</h1></div>
        <p class="version-text">Ideologies &middot; click one for a short description</p>
        <div class="catalog" id="catalog"></div>
        <div class="button-container">
            <button onclick="location.href='index.html'">Home</button>
        </div>
    </div>

    <script>

// ======================================================================
// MAValues shared data: categories, values, ideologies, people, popup menu
// ======================================================================

const categoryNames = {
    culture: "Culture", property: "Property", financing: "Financing", pricing: "Pricing",
    capital: "Capital and Wealth", workplace: "Workplace Structure",
    tactic: "Tactic", communities: "Communities", wage: "Wage Model", focus: "Focus"
};

// Categories and their values + short descriptions
const categoryValues = {
    culture: [
        { name: "Progressive", desc: "Society should keep moving forward and leave outdated traditions behind in favour of greater liberty." },
        { name: "Moderate", desc: "Progress is welcome, but cultural bonds and inherited customs still matter and should be preserved." },
        { name: "Conservative", desc: "Social change should be slowed or resisted; tradition and established norms are worth defending." },
        { name: "Traditionalist", desc: "Society should return to the lifestyle and values of our ancestors." }
    ],
    property: [
        { name: "Lockean Homesteading", desc: "Property is land you homestead or buy, and it remains yours until you voluntarily transfer ownership of it, even if you stop using it." },
        { name: "Constructive Occupancy", desc: "Property is land you live in, use or actively finance and maintain; if you abandon it, anyone else can rehomestead it." },
        { name: "Occupancy & Use", desc: "There is no private property, only possession of what you actively live in or use; if you stop using it yourself, anyone else can rehomestead it." }
    ],
    financing: [
        { name: "Payment for Usage", desc: "Public property is financed by its users: you directly or indirectly pay a price set by the property owner for everything you use." },
        { name: "Mutual Credit", desc: "Public property is financed from a mutual community bank based on voluntary donations." },
        { name: "Land Value Tax", desc: "Public property is financed by a Land Value Tax on unimproved property." }
    ],
    pricing: [
        { name: "Profit-Based Supply & Demand", desc: "Prices are set by consumers and sellers competing with each other through supply and demand." },
        { name: "Cost-Driven Supply & Demand", desc: "In an absolutely free market prices correspond to the cost of production and labour, leaving little to no space for profit, while still relying on supply and demand." },
        { name: "Labour Theory of Value", desc: "Prices should be based on the time of production and the labour needed to produce the product." }
    ],
    capital: [
        { name: "Freed Markets", desc: "Capitalism is not free exchange between individuals but a system that needs the state to function; without the state it turns into freed markets." },
        { name: "Capitalism", desc: "Capitalism is the free exchange between individuals with no state intervention; with the state it turns into cronyism." }
    ],
    workplace: [
        { name: "Hierarchical", desc: "Hierarchies stay intact: business owners have full control over all of their workers." },
        { name: "Horizontal Self-Employment", desc: "The workplace becomes heterarchical, with workers deciding together about decisions in their own area." },
        { name: "Democratic Workplace", desc: "The workplace becomes heterarchical, with workers democratically deciding over important decisions." },
        { name: "Unionism", desc: "Hierarchies stay intact, with worker unions making compromises with company owners over important decisions." }
    ],
    tactic: [
        { name: "Counter Economics", desc: "Starve the state by trading in the black and grey market and ignoring its rules and taxes." },
        { name: "Revolution", desc: "The state must be overthrown directly through a revolution rather than slowly starved or reformed." },
        { name: "Democracy", desc: "Use the already existing democratic foundations to gain popularity and reach the ideal system." },
        { name: "Gradualism", desc: "Form voluntary communities based on mutual aid that outperform the state in efficiency and eventually replace it." }
    ],
    communities: [
        { name: "Covenant Communities", desc: "Communities of people with similar culture and interests, each living on their own property within the settlement." },
        { name: "Cooperative Communities", desc: "Communities built around the mutual ownership and financing of public property." },
        { name: "Atomic Individualism", desc: "Everyone lives on their own property and interferes with others only when needed." }
    ],
    wage: [
        { name: "Traditional Wages", desc: "Workers receive a set monthly or yearly wage." },
        { name: "Profit-based Earnings", desc: "Workers' pay is based on the profit of their company and their role in the company." }
    ]
};

// Focus options (NOT one of the values used for ideology matching)
const focusDescriptions = {
    "No Focus": "Living under a free market and having success.",
    "Egoism": "There is no duty or morality; everyone should do whatever they feel is right, with no universal right and wrong.",
    "Anarcho-Frontierism": "Leaving Earth and settling as far from civilization as possible for maximum individual freedom."
};

// Quick lookup: value name -> description
const valueDescriptions = {};
for (const k in categoryValues) categoryValues[k].forEach(v => valueDescriptions[v.name] = v.desc);

// Ideologies. A profile value can be an array = several acceptable positions.
// An ideology with a "focus" is only reachable when the person's Focus matches it (and their values fit too).
const ideologies = [
    { name: "Rothbardianism", color: "#3b82f6", group: "Anarcho Capitalism",
      desc: "Anarcho-capitalism in the tradition of Murray Rothbard: natural-law property rights, strict Lockean homesteading, and private firms in a fully free market.",
      profile: { culture: "Moderate", property: "Lockean Homesteading", financing: "Payment for Usage", pricing: "Profit-Based Supply & Demand", capital: "Capitalism", workplace: "Hierarchical", tactic: "Counter Economics", communities: ["Covenant Communities", "Atomic Individualism"], wage: "Traditional Wages" } },
    { name: "Hoppeanism", color: "#8b5cf6", group: "Anarcho Capitalism",
      desc: "Anarcho-capitalism in the tradition of Hans-Hermann Hoppe: private property with a strongly traditionalist view of culture and social order.",
      profile: { culture: "Traditionalist", property: "Lockean Homesteading", financing: "Payment for Usage", pricing: "Profit-Based Supply & Demand", capital: "Capitalism", workplace: "Hierarchical", tactic: "Counter Economics", communities: "Covenant Communities", wage: "Traditional Wages" } },
    { name: "Left-Rothbardianism", color: "#ef4444", group: "Left-Wing Market Anarchism",
      desc: "Keeps Rothbardian homesteading and market exchange but pairs them with progressive culture, freed markets and independent, self-managed work.",
      profile: { culture: "Progressive", property: ["Lockean Homesteading", "Constructive Occupancy"], financing: ["Payment for Usage", "Mutual Credit"], pricing: ["Profit-Based Supply & Demand", "Cost-Driven Supply & Demand"], capital: "Freed Markets", workplace: "Horizontal Self-Employment", tactic: ["Counter Economics", "Gradualism"], communities: ["Atomic Individualism", "Cooperative Communities"], wage: "Profit-based Earnings" } },
    { name: "Mutualism", color: "#14b8a6", group: "Left-Wing Market Anarchism",
      desc: "Market anarchism built on occupancy-and-use property, worker associations and the idea that prices should reflect the labour put into goods.",
      profile: { culture: ["Progressive", "Moderate"], property: "Occupancy & Use", financing: "Mutual Credit", pricing: "Labour Theory of Value", capital: "Freed Markets", workplace: ["Democratic Workplace", "Unionism"], tactic: ["Gradualism", "Democracy"], communities: "Cooperative Communities", wage: "Profit-based Earnings" } },
    { name: "Geoanarchism", color: "#f59e0b", group: "Left-Wing Market Anarchism",
      desc: "Market anarchism that treats land as a common inheritance and finances public property through a land value tax, as in Georgism.",

// ---------------- Popup menu (click a value / ideology / person) ----------------
function openInfo(title, subtitle, desc, color, symbolsHTML) {
    closeInfo();
    const overlay = document.createElement('div');
    overlay.className = 'info-overlay';
    overlay.id = 'info-overlay';
    overlay.innerHTML = `
        <div class="info-menu" role="dialog" aria-modal="true">
            <div class="info-bar" style="background:${color || 'var(--accent-soft)'}"></div>
            <button class="info-close" aria-label="Close">&times;</button>
            <div class="info-title"></div>
            ${subtitle ? '<div class="info-sub"></div>' : ''}
            ${symbolsHTML || ''}
            <p class="info-desc"></p>
        </div>`;
    overlay.querySelector('.info-title').textContent = title;
    if (subtitle) overlay.querySelector('.info-sub').textContent = subtitle;
    overlay.querySelector('.info-desc').textContent = desc;
    overlay.addEventListener('click', e => { if (e.target === overlay) closeInfo(); });
    overlay.querySelector('.info-close').addEventListener('click', closeInfo);
    document.body.appendChild(overlay);
}
function closeInfo() {
    const o = document.getElementById('info-overlay');
    if (o) o.remove();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeInfo(); });

);

        `<div class="info-symbols"><img class="info-flag" src="${flagSrc(i.name)}" alt=""></div>`);
    const g = ideologyGroups.find(x => x.name === name);
    if (g) openInfo(g.name, "Ideology group", g.desc, g.color);
};
const openPersonInfo = name => {
    const p = people.find(x => x.name === name);
    if (p) openInfo(p.name, "Person", p.desc, p.color,
        `<div class="info-symbols"><img class="info-flag info-person" src="${personPlaceholder}" alt=""></div>`);
};

(function () {
    const themeToggle = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    htmlElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    if (themeToggle) themeToggle.addEventListener('click', () => {
        const next = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });
})();
