<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAValues - Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Theme Toggle Corner Button -->
    <button class="theme-toggle-corner" id="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24">
            <path class="icon-sun" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 6a6 6 0 100 12 6 6 0 000-12z"></path>
            <path class="icon-moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
    </button>

    <div class="main-container" id="app">
        <!-- Rendered dynamically -->
    </div>

    <script src="data.js"></script>
    <script>
        const valueColors = {
            culture: "#38bdf8", property: "#34d399", ip: "#fbbf24",
            capital: "#f87171", workplace: "#a78bfa", tactic: "#f472b6", price: "#fb923c"
        };

        // ---------- Matching algorithm ----------
        // 1) Partial credit: nearby positions score between 0 and 1 instead of all-or-nothing.
        // 2) Weights: dimensions that define an ideology count more.
        // 3) A % match for every ideology/person, sorted, exact-match count as tie-breaker.
        const ordinal = list => (a, b) => {
            const i = list.indexOf(a), j = list.indexOf(b);
            return (i < 0 || j < 0) ? 0 : 1 - Math.abs(i - j) / (list.length - 1);
        };
        const table = pairs => (a, b) => pairs[a + "|" + b] ?? pairs[b + "|" + a] ?? 0;

        const similarity = {
            culture: ordinal(["Progressive", "Moderate", "Conservatve", "Traditionalist"]),
            property: table({
                "Occupancy & Use|Constructive Occupancy": 0.7,
                "Constructive Occupancy|Lockean Homesteading": 0.6,
                "Occupancy & Use|Georgism": 0.5,
                "Georgism|Lockean Homesteading": 0.4,
                "Georgism|Constructive Occupancy": 0.3,
                "Occupancy & Use|Lockean Homesteading": 0
            }),
            ip: table({}),
            capital: table({
                "Freed Markets|Full Capitalism": 0.5,
                "Full Capitalism|Cronyism": 0.3,
                "Freed Markets|Cronyism": 0
            }),
            workplace: table({
                "Hierarchial|Unionism": 0.4,
                "Hierarchial|Horizontal Self-Employment": 0.3,
                "Horizontal Self-Employment|Unionism": 0.4,
                "Unionism|Democratic Workplace": 0.6,
                "Horizontal Self-Employment|Democratic Workplace": 0.3,
                "Hierarchial|Democratic Workplace": 0
            }),
            tactic: table({
                "Counter Economics|Revolution": 0.5,
                "Counter Economics|Democracy": 0.3,
                "Revolution|Democracy": 0
            }),
            price: table({})
        };

        const weights = { culture: 1.0, property: 1.4, ip: 1.0, capital: 1.2, workplace: 1.2, tactic: 0.8, price: 1.0 };

        function score(entry, answers) {
            let total = 0, max = 0, exact = 0;
            for (const key in answers) {
                const accepted = [].concat(entry.profile[key]);
                const sim = Math.max(...accepted.map(v => v === answers[key] ? 1 : similarity[key](v, answers[key])));
                total += sim * weights[key];
                max += weights[key];
                if (accepted.includes(answers[key])) exact++;
            }
            return { entry, percent: max ? Math.round((total / max) * 100) : 0, exact, raw: total };
        }
        const rank = list => list.map(e => score(e, userResults)).sort((a, b) => b.raw - a.raw || b.exact - a.exact);

        const userResults = JSON.parse(localStorage.getItem('userResults')) || {};

        const rankedIdeologies = rank(ideologies);
        const rankedPeople = rank(people);
        const bestIdeology = rankedIdeologies[0];
        const bestPerson = rankedPeople[0];

        const bars = (list, clickFn) => list.map(r => `
            <div class="bar-row" onclick="${clickFn}('${r.entry.name}')">
                <div class="bar-label"><span>${r.entry.name}</span><span>${r.percent}%</span></div>
                <div class="bar-track"><div class="bar-fill" style="width:${r.percent}%; background:${r.entry.color};"></div></div>
            </div>
        `).join('');

        document.getElementById('app').innerHTML = `
            <div class="main-results-wrapper">
                <div class="title-container">
                    <h1 class="brand">MAValues</h1>
                </div>
                <h2 class="results-heading">Your Results</h2>
                <p class="version-text">Here is your breakdown across all 7 dimensions:</p>

                <div id="results-container">
                    ${Object.keys(userResults).map(key => `
                        <div class="result-item" onclick="openValueInfo('${userResults[key]}', '${key}')">
                            <div class="result-icon" style="background-color: ${valueColors[key]};"></div>
                            <div class="result-text">${userResults[key]}</div>
                        </div>
                    `).join('')}
                </div>

                <div class="result-header-text">Closest Match Ideology</div>
                <div class="label-bubble" style="background-color: ${bestIdeology.entry.color};" onclick="openIdeologyInfo('${bestIdeology.entry.name}')">
                    ${bestIdeology.entry.name} · ${bestIdeology.percent}%
                </div>

                <div class="result-header-text" style="margin-top: 20px;">Other Ideologies</div>
                <div class="bars">${bars(rankedIdeologies.slice(1), 'openIdeologyInfo')}</div>

                <div class="result-header-text" style="margin-top: 30px;">Closest Match Person</div>
                <div class="label-bubble" style="background-color: ${bestPerson.entry.color};" onclick="openPersonInfo('${bestPerson.entry.name}')">
                    ${bestPerson.entry.name} · ${bestPerson.percent}%
                </div>

                <div class="result-header-text" style="margin-top: 20px;">Other People</div>
                <div class="bars">${bars(rankedPeople.slice(1), 'openPersonInfo')}</div>

                <div class="button-container" style="margin-top: 25px;">
                    <button onclick="location.href='index.html'">Home</button>
                    <button onclick="location.href='test.html'">Retake Quiz</button>
                </div>
            </div>
        `;
    </script>
</body>
</html>
