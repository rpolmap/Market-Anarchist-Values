<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Anarchist Quiz - Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Theme Toggle Corner Button -->
    <button class="theme-toggle-corner" id="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24">
            <path class="icon-sun" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 6a6 6 0 100 12 6 6 0 000-12z"></path>
            <path class="icon-moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
    </button>

    <div class="main-container" id="app">
        <!-- Rendered dynamically -->
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        htmlElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        themeToggle.addEventListener('click', () => {
            const next = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        const A = "Agree", N = "Neutral", D = "Disagree";
        const wrap = x => typeof x === 'string' ? { result: x } : { next: x };
        // q(prompt, onAgree, onNeutral, onDisagree): string = final result, object = next question
        const q = (prompt, a, n, d) => ({
            prompt,
            choices: [{ label: A, ...wrap(a) }, { label: N, ...wrap(n) }, { label: D, ...wrap(d) }]
        });

        // ---------- Culture ----------
        const cultureBonds = q("Although we need to progress, maintaining cultural bonds is necessary.",
            "Moderate", "Moderate", "Progressive");
        const cultureLeave = q("We should leave the past behind, as society always naturally progresses.",
            "Progressive", cultureBonds, "Moderate");
        const cultureStop = q("We should stop social progress and completely return to the lifestyle of our ancestors.",
            "Traditionalist", "Conservative", "Conservative");

        // ---------- Property ----------
        const landQ = "Unused natural land should belong to everyone equally.";
        const propAgree = q(landQ, "Georgism", "Occupancy & Use", "Occupancy & Use");
        const propOther = q(landQ, "Georgism", "Georgism", "Absolute Lockean");

        // ---------- Intellectual Property ----------
        const ipCopy = q("When you create a new product, no one else should be able to copy it without your consent.",
            "Proprietary IP", "Proprietary IP", "Anti-IP");

        // ---------- Capital & Wealth ----------
        const capNatural = q("Companies profiting from cronyism right now should be left to naturally collapse or adapt to the new system, while respecting the CEOs' positions and legitimacy.",
            "Full Capitalism", "Full Capitalism", "Freed Markets");
        const capCollapse = q("Every company profiting from cronyism right now is illegitimate and should immediately, entirely or partially, collapse or be reformed.",
            "Freed Markets", capNatural, capNatural);

        // ---------- Workplace Structure ----------
        const workUnion = q("Worker unions are preferable to individual labour.",
            "Unionism", "Hierarchical", "Hierarchical");
        const workUnion2 = q("Worker unions are preferable to individual labour.",
            "Unionism", "Unionism", "Horizontal Self-Employment");
        const workHire = q("Workers in the same sector should be able to collectively hire and fire.",
            "Horizontal Self-Employment", "Horizontal Self-Employment", workUnion2);
        const workElect = q("Workers should democratically elect their bosses every few years.",
            "Democratic Workplace", workHire, workHire);

        // ---------- Tactic ----------
        const tacticBlack = q("The only realistic way of reaching our goals is starving the state with the help of the black market.",
            "Counter Economics", "Counter Economics", "Revolution");
        const tacticElect = q("The only realistic way of popularizing our ideas is through participation in elections and the democratic system.",
            "Democracy", tacticBlack, tacticBlack);

        const quizTree = {
            culture:   q("We are progressing towards greater liberty and freedom.", cultureLeave, cultureLeave, cultureStop),
            property:  q("Everyone should have the right to reclaim abandoned land, even when it's owned by somebody but not actively used.", propAgree, propOther, propOther),
            ip:        q("Nobody should be able to restrict what can be produced or used.", "Anti-IP", ipCopy, "Proprietary IP"),
            capital:   q("There is nothing wrong with someone intervening in the market to restrict rival companies when the intervening power and the company being helped agree.", "Cronyism", capCollapse, capCollapse),
            workplace: q("We should keep the current hierarchical workplace structure.", workUnion, workUnion, workElect),
            tactic:    q("We should reach our goals using the present political landscape.", "Democracy", tacticElect, tacticBlack)
        };

        const keys = Object.keys(quizTree);
        let categoryIndex = 0;
        let currentNode = quizTree[keys[0]];
        let userResults = {};

        const app = document.getElementById('app');

        function render() {
            app.innerHTML = `
                <div class="title-container">
                    <h1 style="font-size: 2rem;">Question ${categoryIndex + 1} of ${keys.length}</h1>
                </div>
                <p class="version-text" style="text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px;">Category: ${keys[categoryIndex]}</p>
                <div class="question-container">
                    <div id="question">${currentNode.prompt}</div>
                </div>
                <div id="buttons">
                    ${currentNode.choices.map((c, i) => `<button onclick="choose(${i})">${c.label}</button>`).join('')}
                </div>
            `;
        }

        function choose(i) {
            const choice = currentNode.choices[i];
            if (choice.result) {
                userResults[keys[categoryIndex]] = choice.result;
                categoryIndex++;
                if (categoryIndex < keys.length) {
                    currentNode = quizTree[keys[categoryIndex]];
                    render();
                } else {
                    localStorage.setItem('userResults', JSON.stringify(userResults));
                    location.href = 'results.html';
                }
            } else if (choice.next) {
                currentNode = choice.next;
                render();
            }
        }

        render();
    </script>
</body>
</html>
