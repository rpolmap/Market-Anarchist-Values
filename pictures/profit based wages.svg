<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 58 376 376" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- NeoValues Circular Icon Group (Clear Background) -->
  <g transform="translate(250, 250)">
    
    <!-- Outer Gold Border Ring -->
    <circle cx="0" cy="0" r="180" fill="#ffd700" filter="url(#shadow)"/>
    
    <!-- Thin Inner Dark Separation Ring -->
    <circle cx="0" cy="0" r="172" fill="#1a1a1a"/>
    
    <!-- Main Badge Background (Stock/Profit Emerald Green) -->
    <circle cx="0" cy="0" r="164" fill="#006837"/>

    <!-- SYMBOL: Volatile Stock Market Trend (Fluctuating Up & Down to Overall Net Growth) -->
    <g transform="translate(0, 0) scale(1.35)">
      
      <!-- Candlestick / Bar Chart Elements (Showing Highs & Lows) -->
      <!-- Bar 1 (Dip) -->
      <rect x="-62" y="-5" width="14" height="35" rx="2" fill="#ffffff" opacity="0.6"/>
      <line x1="-55" y1="-18" x2="-55" y2="42" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

      <!-- Bar 2 (Peak) -->
      <rect x="-32" y="-42" width="14" height="48" rx="2" fill="#ffffff" opacity="0.8"/>
      <line x1="-25" y1="-50" x2="-25" y2="18" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>

      <!-- Bar 3 (Dip/Correction) -->
      <rect x="-2" y="-12" width="14" height="38" rx="2" fill="#ffffff" opacity="0.6"/>
      <line x1="5" y1="-22" x2="5" y2="35" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

      <!-- Bar 4 (Final Rally Peak) -->
      <rect x="28" y="-55" width="14" height="65" rx="2" fill="#ffffff"/>
      <line x1="35" y1="-62" x2="35" y2="22" stroke="#ffffff" stroke-width="2.5"/>

      <!-- Realistic Volatile Line (Up -> Down -> Up Market Waves) -->
      <path d="M -65 22 L -45 5 L -25 -38 L 5 -5 L 48 -48" fill="none" stroke="#ffd700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Trend Arrowhead -->
      <path d="M 28 -50 L 52 -50 L 52 -26" fill="none" stroke="#ffd700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Baseline / Floor -->
      <line x1="-65" y1="48" x2="65" y2="48" stroke="#ffd700" stroke-width="3.5" stroke-linecap="round"/>

    </g>
  </g>
</svg>

