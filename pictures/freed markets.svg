<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 58 376 376" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- NeoValues Circular Icon Group (Clear Background) -->
  <g transform="translate(250, 250)">
    
    <!-- Outer Gold Border Ring -->
    <circle cx="0" cy="0" r="180" fill="#ffd700" filter="url(#shadow)"/>
    
    <!-- Thin Inner Dark Separation Ring -->
    <circle cx="0" cy="0" r="172" fill="#1a1a1a"/>
    
    <!-- Main Badge Background (Agorist Black Background) -->
    <circle cx="0" cy="0" r="164" fill="#111111"/>

    <!-- SYMBOL: Open-Air Agora Marketplace (Stalls, Goods, and Peer-to-Peer Exchange) -->
    <g transform="translate(0, 0) scale(1.2)">
      
      <!-- Marketplace Ground Base Line -->
      <line x1="-110" y1="75" x2="110" y2="75" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>

      <!-- LEFT MARKETPLACE STALL -->
      <g transform="translate(-55, 0)">
        <!-- Striped Canopy Tent Top -->
        <path d="M -50 -10 L 0 -45 L 50 -10 Z" fill="#ffd700"/>
        <path d="M -30 -24 L -15 -34 L 0 -45 L -10 -10 L -30 -10 Z" fill="#ffffff" opacity="0.3"/>
        <path d="M 15 -24 L 30 -10 L 10 -10 L 0 -45 Z" fill="#ffffff" opacity="0.3"/>
        <!-- Scalloped Canopy Eaves -->
        <path d="M -50 -10 Q -40 -2 -30 -10 Q -20 -2 -10 -10 Q 0 -2 10 -10 Q 20 -2 30 -10 Q 40 -2 50 -10 L 50 -5 L -50 -5 Z" fill="#ffd700"/>
        
        <!-- Counter Table -->
        <rect x="-42" y="30" width="84" height="45" rx="3" fill="none" stroke="#ffd700" stroke-width="4"/>
        <line x1="-42" y1="42" x2="42" y2="42" stroke="#ffd700" stroke-width="3"/>
        
        <!-- Support Poles -->
        <line x1="-45" y1="-5" x2="-45" y2="75" stroke="#ffffff" stroke-width="3.5" opacity="0.8"/>
        <line x1="45" y1="-5" x2="45" y2="75" stroke="#ffffff" stroke-width="3.5" opacity="0.8"/>
        
        <!-- Goods Displayed on Table (Produce / Items) -->
        <circle cx="-20" cy="22" r="7" fill="#ffffff"/>
        <circle cx="0" cy="20" r="9" fill="#ffd700"/>
        <circle cx="20" cy="22" r="7" fill="#ffffff"/>
      </g>

      <!-- RIGHT MARKETPLACE STALL -->
      <g transform="translate(55, 0)">
        <!-- Striped Canopy Tent Top -->
        <path d="M -50 -10 L 0 -45 L 50 -10 Z" fill="#ffd700"/>
        <path d="M -30 -24 L -15 -34 L 0 -45 L -10 -10 L -30 -10 Z" fill="#ffffff" opacity="0.3"/>
        <path d="M 15 -24 L 30 -10 L 10 -10 L 0 -45 Z" fill="#ffffff" opacity="0.3"/>
        <!-- Scalloped Canopy Eaves -->
        <path d="M -50 -10 Q -40 -2 -30 -10 Q -20 -2 -10 -10 Q 0 -2 10 -10 Q 20 -2 30 -10 Q 40 -2 50 -10 L 50 -5 L -50 -5 Z" fill="#ffd700"/>
        
        <!-- Counter Table -->
        <rect x="-42" y="30" width="84" height="45" rx="3" fill="none" stroke="#ffd700" stroke-width="4"/>
        <line x1="-42" y1="42" x2="42" y2="42" stroke="#ffd700" stroke-width="3"/>
        
        <!-- Support Poles -->
        <line x1="-45" y1="-5" x2="-45" y2="75" stroke="#ffffff" stroke-width="3.5" opacity="0.8"/>
        <line x1="45" y1="-5" x2="45" y2="75" stroke="#ffffff" stroke-width="3.5" opacity="0.8"/>

        <!-- Goods Displayed on Table (Crates / Boxes) -->
        <rect x="-24" y="14" width="16" height="16" rx="2" fill="#ffd700"/>
        <rect x="8" y="14" width="16" height="16" rx="2" fill="#ffffff"/>
      </g>

      <!-- CENTER VOLUNTARY TRADE SYMBOL (Horizontal Exchange Arrows between Market Stalls) -->
      <g transform="translate(0, -60)">
        <!-- Exchange Curved Top Arrow -->
        <path d="M -35 0 C -20 -20, 20 -20, 35 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <path d="M 22 -8 L 36 1 L 36 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Exchange Curved Bottom Arrow -->
        <path d="M 35 18 C 20 38, -20 38, -35 18" fill="none" stroke="#ffd700" stroke-width="4" stroke-linecap="round"/>
        <path d="M -22 26 L -36 17 L -36 32" fill="none" stroke="#ffd700" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Central Coin / Exchange Medium -->
        <circle cx="0" cy="9" r="11" fill="#ffd700" stroke="#111111" stroke-width="2.5"/>
      </g>

    </g>
  </g>
</svg>

