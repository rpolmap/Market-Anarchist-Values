<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAValues - Changelog</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap');

:root {
    --bg-color: #18181b;
    --card-bg: #27272a;
    --text-primary: #f4f4f5;
    --text-dim: #a1a1aa;
    --accent-primary: #d4d4d8;
    --accent-soft: #71717a;
    --border-color: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.05);
    --radius-lg: 28px;
    --radius-sm: 14px;
    --soft-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    --hover-shadow: rgba(255, 255, 255, 0.1);
    --corner-fill: #f4f4f5;
    --corner-color: #18181b;
    --smooth-transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
}

[data-theme="light"] {
    --bg-color: #f4f4f6;
    --card-bg: #ffffff;
    --text-primary: #18181b;
    --text-dim: #71717a;
    --accent-primary: #27272a;
    --accent-soft: #e4e4e7;
    --border-color: rgba(0, 0, 0, 0.09);
    --card-border: rgba(0, 0, 0, 0.06);
    --soft-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    --hover-shadow: rgba(0, 0, 0, 0.12);
    --corner-fill: #18181b;
    --corner-color: #f4f4f6;
}

.theme-toggle-corner {
    position: fixed;
    top: 0;
    right: 0;
    width: 80px;
    height: 80px;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 9999;
    padding: 0;
    line-height: 0;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    outline: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.theme-toggle-corner:focus,
.theme-toggle-corner:focus-visible,
.theme-toggle-corner:active {
    outline: none;
    box-shadow: none;
}

.theme-toggle-corner svg {
    width: 100%;
    height: 100%;
    fill: var(--corner-fill);
    color: var(--corner-color);
    transition: var(--smooth-transition);
}

.theme-toggle-corner:hover svg {
    transform: scale(1.06);
}

.theme-toggle-corner .icon-sun,
.theme-toggle-corner .icon-moon {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.theme-toggle-corner .icon-sun {
    display: block;
}
.theme-toggle-corner .icon-moon {
    display: none;
}

[data-theme="light"] .theme-toggle-corner .icon-sun {
    display: none;
}
[data-theme="light"] .theme-toggle-corner .icon-moon {
    display: block;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-container {
    width: 100%;
    max-width: 1200px;
    min-height: 100vh;
    padding: 60px 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.title-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

h1 {
    font-weight: 700;
    font-size: 3.2rem;
    margin: 0;
    color: var(--accent-primary);
    letter-spacing: -1.5px;
    text-align: center;
}

.question-container {
    min-height: 140px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
}

#question {
    background-color: var(--card-bg);
    padding: 35px 50px;
    border-radius: var(--radius-lg);
    font-size: 1.4rem;
    font-weight: 500;
    line-height: 1.5;
    box-shadow: var(--soft-shadow);
    max-width: 800px;
    border: 1px solid var(--card-border);
    text-align: center;
}

button {
    padding: 16px 24px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--smooth-transition);
}

button:hover {
    background-color: var(--text-primary);
    color: var(--bg-color);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px var(--hover-shadow);
}

.description-box {
    background-color: var(--card-bg);
    padding: 24px 30px;
    border-radius: var(--radius-lg);
    text-align: center;
    line-height: 1.7;
    border: 1px solid var(--card-border);
    width: 100%;
    max-width: 800px;
    box-sizing: border-box;
    align-self: center;
    margin-bottom: 30px;
    box-shadow: var(--soft-shadow);
    font-size: 1.1rem;
}

#buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 480px;
    margin-top: 10px;
    margin-bottom: 50px;
}

.button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
    margin-bottom: 40px;
    width: 100%;
}

.button-container button {
    width: auto;
    min-width: 220px;
    max-width: 400px;
    text-align: center;
}

.main-results-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px 0;
}

#results-container {
    display: grid;
    grid-template-columns: repeat(3, 140px);
    justify-content: center;
    gap: 24px 30px;
    margin-top: 20px;
    margin-bottom: 35px;
    width: 100%;
    box-sizing: border-box;
}

.result-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 140px;
    box-sizing: border-box;
    transition: var(--smooth-transition);
}

.result-icon {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    margin-bottom: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    transition: var(--smooth-transition);
}

.result-item:hover .result-icon {
    transform: scale(1.08);
}

.result-text {
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text-dim);
    text-transform: uppercase;
    text-align: center;
    width: 100%;
    margin: 0;
}

.label-bubble {
    display: inline-block;
    padding: 14px 40px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1.8rem;
    color: #ffffff;
    margin: 15px 0;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
}

.result-header-text {
    font-size: 1.1rem;
    color: var(--text-dim);
    font-weight: 700;
    margin-top: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

@media (max-width: 800px) {
    #results-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px 10px;
        max-width: 420px;
    }
    .result-item {
        width: 100% !important;
        max-width: 105px;
    }
    .result-icon {
        width: 70px;
        height: 70px;
    }
    .result-text {
        font-size: 0.68rem;
    }
    h1 {
        font-size: 2.3rem;
    }
}

/* ---------- MAValues additions ---------- */
.brand {
    letter-spacing: -2px;
}

.results-heading {
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 6px;
    color: var(--text-primary);
    text-align: center;
}

.result-item,
.label-bubble,
.bar-row,
.chip {
    cursor: pointer;
}

.result-text {
    text-transform: none;
    font-size: 0.9rem;
    color: var(--text-primary);
}

.bars {
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
}

.bar-row {
    margin: 8px 0;
    text-align: left;
}

.bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-primary);
}

.bar-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(128, 128, 128, 0.25);
    overflow: hidden;
}

.bar-fill {
    height: 100%;
}

/* Values / Ideologies screens */
.catalog {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin: 25px 0;
}

.catalog-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--soft-shadow);
    padding: 22px 26px;
}

.catalog-title {
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 14px;
}

.group-title {
    background: transparent;
    border-width: 2px;
    border-style: solid;
    color: var(--text-primary);
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 1rem;
}

.chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.chip {
    padding: 10px 18px;
    font-size: 0.95rem;
    border-radius: 50px;
}

/* Popup menu */
.info-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
    box-sizing: border-box;
}

.info-menu {
    position: relative;
    background-color: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--soft-shadow);
    width: 100%;
    max-width: 380px;
    padding: 26px 26px 22px;
    box-sizing: border-box;
    overflow: hidden;
    text-align: left;
}

.info-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
}

.info-close {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1.3rem;
    line-height: 1;
}

.info-title {
    font-size: 1.3rem;
    font-weight: 700;
    padding-right: 34px;
}

.info-sub {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 4px;
}

.info-desc {
    font-size: 1rem;
    line-height: 1.6;
    margin: 14px 0 0;
}

@media (max-width: 800px) {
    .result-text { font-size: 0.75rem; }
}


/* ---------- Changelog ---------- */
.changelog {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    margin: 30px 0 10px;
}
.release-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--soft-shadow);
    padding: 34px 40px 30px;
    box-sizing: border-box;
}
.release-card h2 {
    margin: 0 0 22px;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.5px;
}
.release-card h3 {
    margin: 20px 0 8px;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent-primary);
}
.release-card ul {
    margin: 0;
    padding-left: 40px;
}
.release-card li {
    font-size: 1.2rem;
    line-height: 1.7;
    margin-bottom: 4px;
}
.release-card p {
    font-size: 1.1rem;
    line-height: 1.6;
    margin: 0 0 10px;
}
.release-card a {
    color: var(--text-primary);
    text-decoration: underline;
}
.release-card code {
    background: rgba(128, 128, 128, 0.2);
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 0.95em;
}
.changelog-status {
    text-align: center;
    color: var(--text-dim);
    font-size: 1.05rem;
    line-height: 1.6;
    padding: 30px 10px;
}
@media (max-width: 800px) {
    .release-card { padding: 26px 22px 22px; }
    .release-card ul { padding-left: 26px; }
    .release-card li { font-size: 1.1rem; }
}
</style>
</head>
<body>

    <!-- Theme Toggle Corner Button -->
    <button class="theme-toggle-corner" id="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24">
            <path class="icon-sun" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41M12 6a6 6 0 100 12 6 6 0 000-12z"></path>
            <path class="icon-moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
    </button>

    <div class="main-container">
        <div class="title-container"><h1>Changelog</h1></div>
        <div class="changelog" id="changelog"><div class="changelog-status">Loading releases&hellip;</div></div>
        <div class="button-container">
            <button onclick="location.href='index.html'">Home</button>
        </div>
    </div>

    <script>
    // ------------------------------------------------------------------
    // Changelog synced with the GitHub releases of the repository.
    // Set GITHUB_REPO to "owner/repo". On a github.io address it is detected automatically.
    // ------------------------------------------------------------------
    const GITHUB_REPO = "rpolmap/Market-Anarchist-Values";
    const CACHE_KEY = "mavalues-changelog-cache";

    function repoName() {
        const m = location.hostname.match(/^([^.]+)\.github\.io$/);
        const repo = location.pathname.split('/').filter(Boolean)[0];
        if (m && repo) return m[1] + '/' + repo;
        return GITHUB_REPO;
    }

    const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function inline(t) {
        return esc(t)
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }

    // Small markdown renderer: headings, bullet lists, paragraphs
    function renderBody(md) {
        let html = '', inList = false;
        const close = () => { if (inList) { html += '</ul>'; inList = false; } };
        (md || '').replace(/\r/g, '').split('\n').forEach(line => {
            const l = line.trim();
            let m;
            if (!l) return close();
            if ((m = l.match(/^#{1,6}\s+(.*)$/))) { close(); html += '<h3>' + inline(m[1]) + '</h3>'; }
            else if ((m = l.match(/^[-*+]\s+(.*)$/))) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(m[1]) + '</li>'; }
            else { close(); html += '<p>' + inline(l) + '</p>'; }
        });
        close();
        return html;
    }

    function fmtDate(iso) {
        const d = new Date(iso);
        const p = n => String(n).padStart(2, '0');
        return p(d.getUTCDate()) + '.' + p(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear();
    }

    function render(releases) {
        const box = document.getElementById('changelog');
        const list = releases.filter(r => !r.draft);
        if (!list.length) { box.innerHTML = '<div class="changelog-status">No releases yet.</div>'; return; }
        box.innerHTML = list.map(r => {
            const version = (r.name || r.tag_name || '').replace(/^v(?=\d)/i, '');
            const date = r.published_at || r.created_at;
            return `<div class="release-card">
                <h2>${esc(version)}${date ? ' - ' + fmtDate(date) : ''}</h2>
                ${renderBody(r.body)}
            </div>`;
        }).join('');
    }

    async function load() {
        const box = document.getElementById('changelog');
        const repo = repoName();
        try {
            if (repo.startsWith("YOUR-")) throw new Error('GITHUB_REPO is not set');
            const res = await fetch('https://api.github.com/repos/' + repo + '/releases?per_page=100', { headers: { 'Accept': 'application/vnd.github+json' } });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
            render(data);
        } catch (err) {
            let cached = null;
            try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
            if (cached && cached.length) render(cached);
            else box.innerHTML = '<div class="changelog-status">Could not load the releases right now. Please try again later.</div>';
        }
    }
    load();

// Theme toggle (shared)
(function () {
    const themeToggle = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    htmlElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    if (themeToggle) themeToggle.addEventListener('click', () => {
        const next = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });
})();


</script>
</body>
</html>
